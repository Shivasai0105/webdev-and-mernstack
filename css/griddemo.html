<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        /* 
          --- CSS Grid Layout Explained ---
          CSS Grid is a two-dimensional layout system that allows you to create complex,
          responsive layouts with rows and columns.
        */

        /* This is the parent element that becomes a grid container. */
        .grid-container{
            /* 'display: grid' turns this element into a grid container. */
            display: grid;
            
            /* 'grid-template-columns' defines the columns of the grid.
               'repeat(3, 1fr)' creates 3 columns, each taking up 1 fraction (1fr) of the available space. */
            grid-template-columns: repeat(3, 1fr);
            
            /* 'grid-template-rows' defines the height of the rows. */
            grid-template-rows: 100px 200px 100px;
            
            /* 'gap' specifies the size of the space between the grid items. */
            gap: 5px;
        }

        /* Basic styling for the grid items. */
        .item{
            background-color: aqua;
            border: 1px solid black;
        }

        /* --- Grid Item Placement --- */
        
        /* This item will span from column line 1 to column line 3. */
        .item1{
            grid-column: 1 / 3; /* Starts at line 1, ends before line 3 */
            grid-row: 1 / 2;    /* Starts at line 1, ends before line 2 */
        }

        /* This item will span from column line 3 to column line 4, and row line 1 to row line 3. */
        .item2{
            grid-column: 3 / 4;
            grid-row: 1 / 3;
        }

        /* This item will span from column line 2 to column line 4. */
        .item6{
            grid-column: 2 / 4;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item item6">6</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation bar variations</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: rgb(41, 31, 31);
            color: white;
        }
        .nav_container{
             margin-bottom: 40px; 
        }
        h2{
            margin-bottom: 10px;
        }
        .nav1{
            background-color: gold;
            padding: 10px;
        }
        .nav1 ul{
            list-style-type: none;
            margin: 0;
            padding:0;
            display: flex;
            justify-content: space-between;
        }
        .nav1 li{
            display: inline;

        }
        .nav1 a{
            text-decoration:none;
            /* color; */
            /* background-color: rgb(167, 164, 156);
             */
            padding: 2px 10px;
            position: relative;

        }
        .nav1 a::after{
        content: "";
        position: absolute;
        height: 2px;
        width: 100%;
        bottom:0;
        left: 0;
        background-color: firebrick;
        transform: scaleX(0);
        transition: transform 0.3s ease-in-out;

        }
        .nav1 a:hover::after{
            transform: scaleX(1);
        }
        .nav1 .login-btn{
            background-color: blueviolet;
            color:rgb(255, 255, 255);
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor:pointer;
        }
        .nav2{
            background-color: rgb(175, 145, 90);
            width: 200px;
            padding: 20px;
        }
        .nav2 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        .nav2 li{
            margin-bottom: 12px;

        }
        .nav2 a{
            text-decoration: none;
            color: rgb(72, 15, 158);
            display: block;
            padding: 10px;
            width: 100%;
        }
        .nav2 a:hover{
            background-color:rgb(139, 39, 39);
        }
        .nav2 .login-btn{
            background-color: rgb(85, 42, 165);
            color: white;
            border-radius: 1px;
            
            width: 100%;
            cursor: pointer;
        }
        .nav2 .login-btn:hover{
            background-color: rgb(40, 2, 75);
            border: 1px solid white;
        }

        .nav3{
            background-color: cyan;
            padding: 10px;
        }
        .nav3 ul{
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav3 li:hover{
            background-color: white;
            border: solid black;
            /* padding: 2px; */
        }
        .nav3 a{
            text-decoration: none;
            color: rgb(13, 0, 255);
            padding: 10px;
            display: block;
        }
        .nav3 .dropdown-content{
            display: none;
        }
        .nav3 .dropdown:hover .dropdown-content{
            display: block;
            position: absolute;
            background-color: rgb(0, 157, 255);
            min-width: 150px;
            border-radius: 2px;
        }
        .dropdown-content a:hover{
            background-color: grey;
        }
        .nav3 .login-btn{
            border: none;
        }
    </style>
</head>
<body>
    <div class="nav_container">
        <h2>type 1:Horizontal with underline effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>
    <div class="nav_container">
        <h2>type 2:vertical with hover effect</h2>
        <nav class="nav2">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
            </ul>
            <button class="login-btn">Login</button>
        </nav>
    </div>
    <div class="nav_container">
        <h2>type 3:horizontal with drop down</h2>
        <nav class="nav3">
            <ul>
                
                <li><a href="#">Home</a></li>
                <li class="dropdown"><a href="#">About</a>
                <div class="dropdown-content">
                    <a href="#">Our Story</a>
                    <a href="#">Team</a>
                    <a href="#">Contact</a>
                </div>
            </li>
            <li><a href="#">Products</a></li>
            <li>
            <button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>

</body>
</html>

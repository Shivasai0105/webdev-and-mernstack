<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display property in CSS</title>
</head>
<style>
    *{
        margin:0;
        padding:0;
    }
    .box{
        border: 2px solid blue;
        /* 
          The 'display' property specifies the display behavior of an element.
          
          - 'block': Starts on a new line and takes up the full width available.
                     Respects width, height, margin, and padding. (e.g., <div>, <p>, <h1>)
          
          - 'inline': Does not start on a new line and only takes up as much width as necessary.
                      Does NOT respect width, height, or vertical margin/padding. (e.g., <span>, <a>)
                      
          - 'inline-block': Sits on the same line like an inline element, but behaves like a 
                            block element, meaning it respects width, height, margin, and padding.
                            
          - 'none': The element is completely removed from the page and does not take up any space.
        */
        display: inline-block; 
        padding:45px;
        margin: 10px;
    }

    span {
        /* Spans are 'inline' by default. Notice how they sit next to each other. */
        border: 1px solid red;
    }
</style>
<body>
    <!-- <h1>Display property in CSS</h1>
    <p>The display property in CSS is used to control the layout of an element on a web page. It determines how an element is displayed and how it interacts with other elements.</p>
    <p>There are several values for the display property, including:</p>
    <ul>
        <li><strong>block</strong>: The element is displayed as a block-level element, taking up the full width available.</li>
        <li><strong>inline</strong>: The element is displayed as an inline element, taking up only as much width as necessary.</li>
        <li><strong>inline-block</strong>: The element is displayed as an inline-level block container.</li>
        <li><strong>none</strong>: The element is not displayed at all.</li>
        <li><strong>visibility</strong>: The element is not displayed, but it still takes up space in the layout.</li>
        <li><strong>flex</strong>: The element is displayed as a flexible box container.</li>
        <li><strong>grid</strong>: The element is displayed as a grid container.</li>
        <li><strong>table</strong>: The element is displayed as a table.</li>
        <li><strong>list-item</strong>: The element is displayed as a list item.</li>
        <li><strong>inherit</strong>: The element inherits the display property from its parent element.</li>
    </ul> -->
    <div class="box">
        I am a box
    </div>
    <div class="box">
        I am another box (inline-block)
    </div>
    <span>I am good (inline)</span>
    <span>Boy (inline)</span>
</body>
</html>

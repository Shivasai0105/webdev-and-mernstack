<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavBar using the variables in css</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:wght@100&display=swap');
    </style>
    <style>
        /* 
          CSS Variables (also known as Custom Properties) allow you to store values 
          in one place and reuse them throughout your stylesheet.
        */

        /* 
          The ':root' pseudo-class selects the root element of the document (the <html> tag).
          Defining variables here makes them "global" and accessible to all other elements.
        */
        :root {
            --color1: #c67474;
            --color2: #69c369;
            --color3: #7c7cd2;
            --color4: #cfcf72;
            --color5: #ad86ad;
            --color6: #91c0c0; /* This variable is defined but not used */
        }

        /* Basic reset for all elements */
        * {
            padding: 0;
            margin: 0;
        }

        /* Styling for the navigation bar container (the <ul> element) */
        .navbar {
            display: flex; /* Use flexbox to align list items horizontally */
            list-style: none; /* Remove the default bullet points from the list */
            background-color: rgb(127, 10, 127); /* Fallback background color */
        }

        /* Styling for each navigation item (the <li> elements) */
        .navbar li {
            padding: 10px;
            color: white;
            font-family: "Poppins", sans-serif;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.1s ease-in-out; /* Smooth transition for hover effects */
        }

        li {
            cursor: pointer; /* Change cursor to a pointer on hover */
        }

        /* Change the background color and text color on hover */
        .navbar li:hover{ 
            background-color: var(--color2); /* Use the CSS variable for the color */
            color: black;
        }

        /* 
          The ':nth-child()' pseudo-class selects elements based on their position.
          Here, we use it to give each navigation item a unique background color
          by calling the variables we defined in :root.
        */
        .navbar li:nth-child(1){
            background-color: var(--color1);
        }
        .navbar li:nth-child(2){
            background-color: var(--color2);
        }
        .navbar li:nth-child(3){
            background-color: var(--color3);
        }
        .navbar li:nth-child(4){
            background-color: var(--color4);
        }
        .navbar li:nth-child(5){
            background-color: var(--color5);
        }
    </style>
</head>

<body>
    <div>
        <ul class="navbar">
            <li>
            Home
            </li>
            <li>
                products
            </li>
            <li>
                services
            </li>
            <li>
                contact
            </li>
            <li>
                about
            </li>
        </ul>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        body{
            margin: 0px;
            padding: 0px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            background-color:#bae1ff;
            height: 400px;
            width: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .formtag{
            display: flex;
            justify-content: center;
            flex-direction: column;
            margin: 10px;
            padding: 10px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>Login Page</h2>
        <div class="formtag">
            <form action="">
                <label for="name">Name</label>
                <input type="text">
                <label for="password">Password</label>
                <input type="password" name="" id="">
                <button class="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
